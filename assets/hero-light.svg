<svg xmlns="http://www.w3.org/2000/svg" width="841" height="235" viewBox="-0.5 -0.5 841 235"><style>@media (prefers-reduced-motion: no-preference) {
  .a-card { animation: a-rise .7s cubic-bezier(.2,.7,.2,1) both; }
